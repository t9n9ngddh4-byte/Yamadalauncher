name: YamadaLauncher

options:
  deploymentTarget:
    iOS: "14.0"

targets:
  YamadaLauncher:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.yamada.launcher
      INFOPLIST_KEY_CFBundleDisplayName: Yamada
      INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
      TARGETED_DEVICE_FAMILY: "1"
