name: YamadaLauncher

options:
  deploymentTarget:
    iOS: "14.0"

targets:
  YamadaLauncher:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.yamada.launcher
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_CFBundleDisplayName: YAMADA
      TARGETED_DEVICE_FAMILY: "1"
