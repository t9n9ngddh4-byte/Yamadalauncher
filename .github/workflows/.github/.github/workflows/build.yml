name: Build Yamada Launcher

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        run: |
          xcodebuild \
            -project YamadaLauncher.xcodeproj \
            -scheme YamadaLauncher \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Create IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/YamadaLauncher.app Payload/
          zip -r YamadaLauncher.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: YamadaLauncher
          path: YamadaLauncher.ipa
